[project]
name = "sfqa"
version = "0.1.0"
description = "Dual-timeline extraction of reader reveal chapters and per-character learning chapters from serialized fiction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "numpy>=2.5.4",
    "pydantic>=2",
]

[project.optional-dependencies]
aws = ["boto3>=1.40"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
